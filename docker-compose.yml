services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: "${SERVER_PORT:-8080}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-fiber_monitor}:${POSTGRES_PASSWORD:-Bismillah007*}@host.docker.internal:5432/${POSTGRES_DB:-fiber_monitor}?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:-pcaK63I923fFj/vBXHx6eq+y5eJKdufONfLoob9Bw3InUsvislLG8KhMXRLDLmTv}"
      JWT_EXPIRY_HOURS: "${JWT_EXPIRY_HOURS:-24}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-wuVJgnnbxiLxCQmCOLIims0Lx9PlYiCIVVke4ClHcVjr71i0FEHA2wVgLRzQ/IAk}"
      PING_CONCURRENCY: "${PING_CONCURRENCY:-30}"
      PING_HISTORY_RETENTION_DAYS: "${PING_HISTORY_RETENTION_DAYS:-7}"
      ADMIN_INITIAL_USERNAME: "${ADMIN_INITIAL_USERNAME:-admin}"
      ADMIN_INITIAL_PASSWORD: "${ADMIN_INITIAL_PASSWORD:-siDuw3MI+qCVdJuqAhZIUQ==}"
      GIN_MODE: release
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    # Required to create VPN tunnels and send ICMP as root.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - /etc/ppp:/etc/ppp
      - /tmp:/tmp
      - /lib/modules:/lib/modules:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5