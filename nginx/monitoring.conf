# monitoring reverse proxy
# Berlaku untuk Debian 12 (site config -> /etc/nginx/sites-enabled/monitoring)
#
# Sebelum dipakai:
#   1) DNS : A record  monitoring.jernih.net.id  ->  <IP PUBLIK Anda>
#   2) Port-forwarding : arahkan port 80 & 443 (TCP) di router ke IP server ini.
#   3) Deploy + HTTPS :
#        sudo cp nginx/monitoring.conf /etc/nginx/sites-available/monitoring
#        sudo ln -sf /etc/nginx/sites-available/monitoring /etc/nginx/sites-enabled/
#        sudo rm -f /etc/nginx/sites-enabled/default
#        sudo nginx -t && sudo systemctl reload nginx
#        sudo apt install -y certbot python3-certbot-nginx
#        sudo certbot --nginx -d monitoring.jernih.net.id
#      Certbot otomatis menambah server block :443 + redirect HTTP->HTTPS,
#      dan menyetel ssl_certificate ke /etc/letsencrypt/live/monitoring.jernih.net.id/.

# Untuk WebSocket /api/events
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name monitoring.jernih.net.id;

    client_max_body_size 10m;

    # Frontend build (Vue SPA)
    root /opt/monitoring/web;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /opt/monitoring/web;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Realtime WebSocket streaming (customer status, stats, VPN, alerts)
    location /api/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
        chunked_transfer_encoding on;
    }

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

