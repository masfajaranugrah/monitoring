# monitoring reverse proxy — versi HTTP saja (sebelum SSL dipasang)
# Berlaku untuk deploy di /var/www/monitoring (Debian/Ubuntu, Nginx)
#
# Cara pakai:
#   sudo cp nginx/monitoring.conf /etc/nginx/sites-available/monitoring
#   sudo ln -sf /etc/nginx/sites-available/monitoring /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Setelah itu pasang SSL (lihat DEPLOY-SSL.md):
#   sudo certbot --nginx -d monitoring.jernih.net.id
# Certbot akan menyisipkan blok listen 443 ssl + redirect HTTP->HTTPS
# secara otomatis di file ini.

# Untuk WebSocket/SSE /api/events
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name monitoring.jernih.net.id;

    # Upload firmware/config modem bisa besar
    client_max_body_size 50m;

    # Frontend build (Vue SPA)
    root /var/www/monitoring/web;
    index index.html;

    # Tantangan HTTP-01 certbot (dibutuhkan saat install/renew SSL)
    location /.well-known/acme-challenge/ {
        root /var/www/monitoring/web;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Realtime SSE/WebSocket streaming
    location /api/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
        chunked_transfer_encoding on;
    }

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}