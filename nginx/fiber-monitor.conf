# fiber-monitor reverse proxy
# Berlaku untuk Debian 12 (site config -> /etc/nginx/sites-enabled/fiber-monitor)

# SSE buffering harus dimatikan untuk endpoint /api/events
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name monitor.example.com;

    client_max_body_size 10m;

    # Frontend build (Vue SPA)
    root /opt/fiber-monitor/web;
    index index.html;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Realtime SSE streaming
    location /api/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
        chunked_transfer_encoding on;
    }

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # (Opsional) aktifkan HTTPS di bawah dengan certbot:
    # listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/monitor.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/monitor.example.com/privkey.pem;
}